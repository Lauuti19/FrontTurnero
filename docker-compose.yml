
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turnero-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0 
    volumes:
      - /app/node_modules
    networks:
      - turnero-network
    restart: unless-stopped

networks:
  turnero-network:
    external: true
    name: turnero-network  
